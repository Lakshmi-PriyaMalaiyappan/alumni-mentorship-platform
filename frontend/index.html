<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Alumni Mentorship Platform</title>
<style>body{font-family:Arial;max-width:760px;margin:30px auto;padding:0 16px}input,button{padding:8px;margin:4px 0;width:100%;box-sizing:border-box}
button{background:#2A9D8F;color:#fff;border:0;border-radius:6px;cursor:pointer}.c{border:1px solid #ddd;border-radius:8px;padding:12px;margin:8px 0}</style></head>
<body><h2>AI Mentor Matching</h2>
<label>Your skills (comma separated)</label><input id="skills" value="React, Node.js, SQL">
<label>Interests</label><input id="interests" value="web development">
<label>Target role</label><input id="role" value="Software Engineer">
<button onclick="go()">Find Mentors</button><div id="out"></div>
<script>
async function go(){
 const body={skills:skills.value.split(',').map(s=>s.trim()),interests:interests.value.split(',').map(s=>s.trim()),target_role:role.value,top_n:3};
 const r=await fetch('http://127.0.0.1:8000/match',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 const d=await r.json();
 out.innerHTML=d.map(m=>`<div class="c"><b>${m.name}</b> – ${m.role}, ${m.company}<br>Skills: ${m.skills.join(', ')}<br><b>${m.match_percent}% match</b></div>`).join('');
}
</script></body></html>
